{% extends 'nucleo/base_login.html' %}

{% block content %}
<div class="text-center mb-4">
    <h1 class="h3 mb-3 font-weight-normal">Nueva Contraseña</h1>
    <p class="text-muted">Respuesta correcta. Ahora puedes establecer tu nueva clave.</p>
</div>

<form method="post" class="user">
    {% csrf_token %}
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        {% endfor %}
    {% endif %}

    <div class="form-group">
        <input type="password" name="password_nueva" class="form-control form-control-user" placeholder="Nueva Contraseña" required>
    </div>
    
    <div class="form-group">
        <input type="password" name="password_confirmar" class="form-control form-control-user" placeholder="Confirmar Nueva Contraseña" required>
    </div>

    <button type="submit" class="btn btn-success btn-user btn-block">
        Restablecer Contraseña
    </button>
</form>
{% endblock %}
