{% extends 'nucleo/base_login.html' %}

{% block content %}
<div class="text-center mb-4">
    <h1 class="h3 mb-3 font-weight-normal">Recuperar Acceso</h1>
    <p class="text-muted">Ingresa tu usuario para buscar tu pregunta de seguridad.</p>
</div>

<form method="post" class="user">
    {% csrf_token %}
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        {% endfor %}
    {% endif %}

    <div class="form-group">
        <input type="text" name="username" class="form-control form-control-user" placeholder="Nombre de Usuario" required autofocus>
    </div>

    <button type="submit" class="btn btn-primary btn-user btn-block">
        Continuar
    </button>
    
    <div class="text-center mt-3">
        <a class="small" href="{% url 'nucleo:login' %}">Volver al inicio de sesión</a>
    </div>
</form>
{% endblock %}
